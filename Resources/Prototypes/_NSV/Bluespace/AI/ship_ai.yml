- type: utilityQuery
  id: NsvBluespacePatrolTargets
  query:
  - !type:NsvNearbyShipTargetsQuery
    blacklist:
      tags:
      - ShuttleAIIgnore
  considerations:
  - !type:TargetInverseDistanceCon
    curve: !type:QuadraticCurve
      slope: 1
      exponent: 1
      yOffset: 0
      xOffset: 0
  - !type:TargetIsAliveOrNACon
    curve: !type:BoolCurve

- type: htnCompound
  id: NsvBluespacePatrolCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NsvBluespacePatrolTargets
    - !type:HTNCompoundTask
      task: NsvBluespacePatrolAttackCompound

- type: htnCompound
  id: NsvBluespacePatrolAttackCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: TargetCoordinates
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ShipMoveToOperator
        shutdownState: PlanFinished
        removeKeyOnFinish: false
        alwaysFaceTarget: true
        inRangeMaxSpeed: 4
        avoidProjectiles: true
        range: 750
        rangeTolerance: 150
        targetKey: TargetCoordinates
    - !type:HTNPrimitiveTask
      operator: !type:ShipFireGunsOperator
        shutdownState: TaskFinished
        removeKeyOnFinish: false
        leadingAccuracy: 0.6
        targetKey: TargetCoordinates
      services:
      - !type:UtilityService
        id: TargetsService
        proto: NsvBluespacePatrolTargets
        key: Target
        coordinatesKey: TargetCoordinates

- type: entity
  id: NsvBluespacePatrolCoreSpawner
  parent: SpawnMobAttackerCoreStaticSmart
  components:
  - type: ConditionalSpawner
    prototypes:
    - NsvBluespacePatrolCore

- type: entity
  id: NsvBluespacePatrolCore
  parent: NpcStationAiAttackerStaticSmart
  components:
  - type: HTN
    rootTask:
      task: NsvBluespacePatrolCompound
  - type: NsvBluespaceShipAiCore
  - type: NsvShipTarget

# Broadside variant: cloned from Mono's ShuttleAttackBroadsideCompound with the
# faction-aware NsvBluespacePatrolTargets query swapped in for candidate selection.
- type: htnCompound
  id: NsvBluespaceBroadsideCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NsvBluespacePatrolTargets
    - !type:HTNCompoundTask
      task: NsvBluespaceBroadsideAttackCompound

- type: htnCompound
  id: NsvBluespaceBroadsideAttackCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: TargetCoordinates
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:ShipMoveToOperator
        shutdownState: PlanFinished
        removeKeyOnFinish: false
        alwaysFaceTarget: true
        inRangeMaxSpeed: null # orbit at top velocity
        range: 450
        rangeTolerance: 50
        targetKey: TargetCoordinates
        mode: OrbitCW
        targetRotation: 90
    - !type:HTNPrimitiveTask
      operator: !type:ShipFireGunsOperator
        shutdownState: TaskFinished
        removeKeyOnFinish: false
        leadingAccuracy: 0.4
        targetKey: TargetCoordinates
      services:
      - !type:UtilityService
        id: TargetsService
        proto: NsvBluespacePatrolTargets
        key: Target
        coordinatesKey: TargetCoordinates

- type: entity
  id: NsvBluespaceBroadsideCoreSpawner
  parent: NsvBluespacePatrolCoreSpawner
  components:
  - type: ConditionalSpawner
    prototypes:
    - NsvBluespaceBroadsideCore

- type: entity
  id: NsvBluespaceBroadsideCore
  parent: NpcStationAiAttackerStaticSmart
  components:
  - type: HTN
    rootTask:
      task: NsvBluespaceBroadsideCompound
  - type: NsvBluespaceShipAiCore
  - type: NsvShipTarget

# Standalone (non-HTN) AI core. Uses NsvShipAiSystem instead of an HTN component; do NOT add a
# HTN component here or the two will fight over the same steering/targeting.
- type: entity
  id: NsvBluespaceStandaloneCoreSpawner
  parent: NsvBluespacePatrolCoreSpawner
  components:
  - type: ConditionalSpawner
    prototypes:
    - NsvBluespaceStandaloneCore

- type: entity
  id: NsvBluespaceStandaloneCore
  parent: NpcStationAiAttackerStaticSmart
  components:
  - type: NsvShipAi
    blacklist:
      tags:
      - ShuttleAIIgnore
  - type: NsvBluespaceShipAiCore
  - type: NsvShipTarget

# Broadside variant of the standalone AI, defined purely in data: orbit the target clockwise
# at 450m with the ship's flank towards it. No code differs from NsvBluespaceStandaloneCore.
- type: entity
  id: NsvBluespaceStandaloneBroadsideCore
  parent: NsvBluespaceStandaloneCore
  components:
  - type: NsvShipAi
    steeringMode: OrbitCW
    targetRotation: 90
    engageRange: 450
    engageRangeTolerance: 50
    inRangeMaxSpeed: null # orbit at top velocity
    leadingAccuracy: 0.4

# Spin-in-place smoke test for the standalone AI: exercises NsvShipAiSystem -> steering
# rotation control without any combat. Spin speed is rad/s (0.5 = ~29 deg/s).
- type: entity
  id: NsvBluespaceSpinTestCore
  parent: NsvBluespaceStandaloneCore
  components:
  - type: NsvShipAi
    testSpinSpeed: 0.5

# Keep-distance smoke test: backs off until it has ~100m hull-to-hull clearance from every
# other grid on the map, then holds position. Exercises the "AI feeds waypoints" pattern.
- type: entity
  id: NsvBluespaceKeepDistanceTestCore
  parent: NsvBluespaceStandaloneCore
  components:
  - type: NsvShipAi
    testKeepDistance: 100
