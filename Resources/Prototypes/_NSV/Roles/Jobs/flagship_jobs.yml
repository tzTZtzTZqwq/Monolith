# N1: the flagship crew for the pure-campaign preset (MonoNsvFlagship). No playtime requirements yet.
# Doors aren't split by department yet (option A): jupiterG's doors use pirate access (Pirate, plus
# GrandVizier on the captain's hatch), so every job carries Pirate; jobs differ by gear, spawn point
# and duties. Engineering and medical also get their department access groups for APCs, lockers etc.

# --- Command -------------------------------------------------------------------------------------

- type: job
  id: NsvCaptain
  name: job-name-nsv-captain
  description: job-description-nsv-captain
  playTimeTracker: JobNsvCaptain
  startingGear: NsvCaptainGear
  alwaysUseSpawner: true
  icon: "JobIconCaptain"
  supervisors: job-supervisors-nsv-command
  canBeAntag: false
  setPreference: true
  weight: 20
  displayWeight: 20
  accessGroups:
  - AllAccess
  - GeneralAccess
  access:
  - Pirate
  - GrandVizier
  - PDVCommand

- type: job
  id: NsvBridgeOfficer
