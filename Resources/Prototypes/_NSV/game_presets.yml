# NSV campaign mode (feature branch). Mirrors MonoStandard's baseline round setup and adds the
# NsvCampaign round-loop rule on top. Admin-selectable only (showInVote: false) while WIP.
- type: gamePreset
  id: MonoNsvCampaign
  alias:
    - nsvcampaign
  name: mono-nsv-campaign-title
  description: mono-nsv-campaign-description
  showInVote: false
  rules:
  - NFAdventure
  - BasicStationEventScheduler
  - BluespaceEventScheduler
  - BluespaceDungeonEventScheduler
  - BluespaceSalvageEventScheduler
  - SmugglingEventScheduler
  - FrontierRoundstartVariation
  - MonoMonolithicEventsScheduler
  - ManualPortstrikeTsfPdv
  - StarSystemKyphrus
  - NsvCampaign

# N1: pure NSV campaign. The round is one flagship (jupiterG via NsvFlagshipMapPool) with everyone
# spawning aboard as captain or crew; no Frontier outposts, shipyards or bought ships, and no
# station event schedulers (they target outposts that don't exist here). The campaign rule ends the
# round (outcome vote, flagship lost, or a scored return home). Admin-selectable only while WIP.
- type: gamePreset
  id: MonoNsvFlagship
  alias:
  - nsvflagship
  name: mono-nsv-flagship-title
  description: mono-nsv-flagship-description
  showInVote: false
  supportedMaps: NsvFlagshipMapPool
  rules:
  - NsvCampaign
