- type: entity
  parent: [BaseThruster, ConstructibleMachine]
  id: NsvCombustionThruster2x4
  name: large combustion thruster
  description: A 2x4 shuttle thruster burning plasma and oxygen from two separate pipe feeds.
  placement:
    mode: AlignTileAny
  components:
  - type: Machine
    board: NsvCombustionThruster2x4MachineCircuitboard
  - type: Construction
    graph: Machine2x4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 7500
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: destroyedMachineFrame
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-3.45,1.45,0.45"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 18000
  - type: Thruster
    thrust: 2400
    baseThrust: 2400
    partRatingThrustMultiplier: 1.118034
    nozzleOffsets:
    - 0,1
    - 1,1
    burnShape: ["-0.3,0.5","0.2,1.6","0.8,1.6","1.3,0.5"]
    damage:
      types:
        Heat: 240
  - type: NsvCombustionThruster
    plasmaMolesPerSecond: 1.5
    oxygenPerPlasma: 1.4
  - type: NodeContainer
    nodes:
      plasma:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
        volume: 200
      oxygen:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
        volume: 200
  - type: AtmosDevice
    requireAnchored: true
    joinSystem: true
  - type: AtmosUnsafeUnanchor
  - type: Sprite
    sprite: _NSV/Structures/Shuttles/thruster_large_v1.rsi
    offset: 0.5,-1.5
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0,3
  - type: DeviceNetwork # Mono
    deviceNetId: Wireless # Mono
    receiveFrequencyId: BasicDevice # Mono
  - type: WirelessNetworkConnection # Mono
    range: 200 # Mono
  - type: DeviceLinkSink # Mono
    ports: # Mono
    - On # Mono
    - Off # Mono
    - Toggle # Mono
  - type: Anchorable
    delay: 10
  - type: Rotatable
    rotateWhileAnchored: false
    increment: 90
  - type: StaticPrice
    price: 3000
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#FFAA66"
    scale: 2
    shape: diamond
    gridConfig:
      color: "#FFAA66"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-3.5,1.5,0.5"
  - type: ShipRepairable
    repairTime: 30
    repairCost: 30

- type: entity
  parent: NsvCombustionThruster2x4
  id: NsvCombustionThruster2x4PartsT2
  name: large combustion thruster
  suffix: T2 Parts
  components:
  - type: Machine
    partOverrides:
      Capacitor: AdvancedCapacitorStockPart
