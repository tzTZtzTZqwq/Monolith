- type: nsvCargoMarket
  id: NSVHomeMarket
  name: nsv-cargo-market-home-name
  buy:
    defaultMultiplier: 1
    offers:
    - product: ShuttleThruster
      multiplier: 0.9
      maxPerTransaction: 5
    - product: ShuttleGyroscope
      multiplier: 0.9
      maxPerTransaction: 3
    - product: EngineSolar
      multiplier: 0.85
      maxPerTransaction: 5
    - product: ServiceJanitorial
      multiplier: 0.8
      maxPerTransaction: 10
  sell:
    defaultMultiplier: null
    rules:
    - whitelist:
        tags:
        - Ore
      multiplier: 1.1
    - whitelist:
        components:
        - Gun
      multiplier: 0.7

